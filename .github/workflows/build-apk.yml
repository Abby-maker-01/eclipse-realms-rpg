
name: Build Eclipse RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode game
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan project game
        run: |
          npm init -y
          mkdir -p www
          cp index.html www/index.html
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Konfigurasi Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.eclipse.realmsruin",
            "appName": "Eclipse RPG",
            "webDir": "www"
          }
          EOF

      - name: Buat project Android
        run: npx cap add android

      - name: Sinkronisasi game
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-rpg-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
